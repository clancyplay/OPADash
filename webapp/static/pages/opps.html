<!-- OPPORTUNITIES -->
<div id="opps" class="page">
  <div class="opp-head">
    <div>
      <h1>Opportunities</h1>
      <p class="sub">Delta first, sized at $500. Cross-exchange spread, plus a wide Delta book where recent prints show a back quote can still fill. Start on the contract from the row.</p>
    </div>
    <span id="oppMeta" class="ctrl-meta"></span>
  </div>
  <div class="ctrl-bar">
    <div class="ctrl-fields">
      <label class="ctrl-field">Notional
        <input id="oppNotional" type="number" min="100" step="100" value="500" inputmode="decimal" onchange="onOppNotional()" />
      </label>
      <label class="ctrl-field">Search
        <input id="oppSearch" type="search" placeholder="BTC, stack…" oninput="renderOpps()" />
      </label>
      <label class="ctrl-check"><input type="checkbox" id="oppHideRun" onchange="renderOpps()" /> Hide running</label>
      <label class="ctrl-check"><input type="checkbox" id="oppAuto" onchange="setupOppAuto()" checked /> Auto</label>
    </div>
    <div class="ctrl-actions">
      <button class="btn" type="button" onclick="loadOpps(true)">Refresh</button>
    </div>
  </div>
  <div class="opp-kinds" id="oppKinds" role="tablist"></div>
  <div id="oppStatus" class="status-bar"></div>
  <div id="oppList" class="opp-grid"></div>
  <p class="opp-notes" id="oppNotes"></p>
</div>
