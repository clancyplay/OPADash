<!-- RPNL -->
<div id="rpnl" class="page">
  <div class="rp-top">
    <div class="rp-bar">
      <select id="rpnlSymbol" title="Symbol" aria-label="Symbol" onchange="loadRpnlFresh()"></select>
      <select id="rpnlHours" title="Window" aria-label="Window" onchange="loadRpnlFresh()">
        <option value="today">Today</option>
        <option value="1">1h</option>
        <option value="3">3h</option>
        <option value="6">6h</option>
        <option value="12">12h</option>
        <option value="24" selected>24h</option>
        <option value="48">48h</option>
        <option value="72">3d</option>
        <option value="168">7d</option>
        <option value="336">14d</option>
        <option value="720">30d</option>
      </select>
      <select id="rpnlCandle" title="Candles" aria-label="Candles" onchange="loadRpnlFresh()">
        <option value="1m">1m</option>
        <option value="5m" selected>5m</option>
        <option value="15m">15m</option>
        <option value="1h">1h</option>
        <option value="4h">4h</option>
      </select>
      <button class="btn rp-more-btn" type="button" id="rpnlMoreBtn" onclick="toggleRpnlMore()" aria-expanded="false">More</button>
      <div class="rp-more">
        <select id="rpnlBucket" title="Bucket" aria-label="Bucket" onchange="loadRpnlFresh()">
          <option value="1">1m</option>
          <option value="5" selected>5m</option>
          <option value="15">15m</option>
          <option value="30">30m</option>
          <option value="60">1h</option>
        </select>
        <select id="rpnlVenue" title="Venue" aria-label="Venue" onchange="onRpnlVenueChange()">
          <option value="both">Both</option>
          <option value="quote">Quote</option>
          <option value="hedge">Hedge</option>
        </select>
        <button class="btn" type="button" onclick="loadRpnlFresh()">Refresh</button>
        <button class="btn" type="button" onclick="fitRpnlView()" title="Fit both charts to the full window">Fit</button>
        <label class="rp-check"><input type="checkbox" id="rpnlAuto" onchange="setupRpnlAuto()" checked /> Auto</label>
        <div class="rp-views">
          <button class="btn" type="button" id="viewCumul" onclick="setRpnlView('cumul')">Cumul</button>
          <button class="btn" type="button" id="viewBucket" onclick="setRpnlView('bucket')">Bucket</button>
          <button class="btn" type="button" id="toggleAutoY" onclick="toggleAutoY()" title="Toggle Y-axis auto-scale">Auto Y</button>
        </div>
      </div>
    </div>
    <div id="rpnlStatus" class="status-bar" hidden></div>
    <div class="error-panel" id="rpnlError"></div>
    <div id="rpnlSummaryWrap" class="rpnl-pills"></div>
    <div id="rpnlInspect" class="rpnl-inspect"></div>
  </div>
  <div class="rp-charts rpnl-stack">
    <div class="rp-pane">
      <div class="rp-ohlc-hud" id="ohlcHud">
        <div class="hud-row">
          <span class="hud-title" id="ohlcHudTitle">Price</span>
          <span class="hud-chg" id="ohlcHudChg"></span>
          <span class="hud-eta" id="ohlcHudEta"></span>
        </div>
        <div class="hud-ohlc" id="ohlcHudStats"></div>
      </div>
      <div class="rp-ohlc-tools" id="ohlcTools">
        <button type="button" class="rp-tool on" data-ohlc-style="candle" title="Candlesticks">Cdl</button>
        <button type="button" class="rp-tool" data-ohlc-style="bar" title="OHLC bars">Bar</button>
        <button type="button" class="rp-tool" data-ohlc-style="line" title="Line">Line</button>
        <button type="button" class="rp-tool" data-ohlc-style="area" title="Area">Area</button>
        <span class="rp-tool-gap"></span>
        <button type="button" class="rp-tool on" data-ohlc-ma="7" title="SMA 7">7</button>
        <button type="button" class="rp-tool on" data-ohlc-ma="25" title="SMA 25">25</button>
        <button type="button" class="rp-tool" data-ohlc-ma="99" title="SMA 99">99</button>
        <span class="rp-tool-gap"></span>
        <button type="button" class="rp-tool on" data-ohlc-tog="vol" title="Volume">Vol</button>
        <button type="button" class="rp-tool on" data-ohlc-tog="fills" title="Fill markers">Fills</button>
        <button type="button" class="rp-tool" data-ohlc-tog="log" title="Log price scale">Log</button>
      </div>
      <button type="button" class="rp-go-live" id="ohlcGoLive" hidden onclick="rpnlGoLive()" title="Jump to latest candle">▶</button>
      <div class="rp-pane-lab" id="ohlcPaneLabel" hidden>Price · vol · fills</div>
      <div id="ohlcChart"></div>
      <div class="chart-empty" id="ohlcEmpty">No price candles for this window</div>
      <div class="chart-legend" id="ohlcLegend"></div>
    </div>
    <div class="rp-pane">
      <div class="rp-pane-lab" id="rpnlPaneLabel">Cumulative rPnL (₹)</div>
      <div id="rpnlChart"></div>
      <div class="chart-legend" id="rpnlLegend"></div>
      <div id="rpnlBrush" class="rpnl-brush" hidden></div>
      <div id="rpnlSelectLayer" class="rpnl-select-layer" hidden></div>
    </div>
  </div>
  <div class="rp-foot" id="rpnlTools">
    <div class="rp-dates">
      <label>From <input type="datetime-local" id="rpnlFrom" step="60" title="From (IST)" onchange="rpnlPinFromInputs()" /></label>
      <label>To <input type="datetime-local" id="rpnlTo" step="60" title="To (IST)" onchange="rpnlPinFromInputs()" /></label>
    </div>
    <span class="range-mode" id="rpnlRangeMode">chart view</span>
    <button class="btn" type="button" onclick="rpnlFollowView()" title="Keep the window locked to whatever is on screen">Follow</button>
    <button class="btn" type="button" id="rpnlSelectBtn" onclick="toggleRpnlSelect()" title="Drag on the rPnL chart to pick a window">Select</button>
    <button class="btn" type="button" onclick="rpnlJumpChartToRange()" title="Zoom the charts to the From/To times">Jump</button>
    <span class="rp-inspect">
      <button class="btn" type="button" data-rpnl-kind="logs" onclick="openRpnlKind('logs')">Logs</button>
      <button class="btn" type="button" data-rpnl-kind="fills" onclick="openRpnlKind('fills')">Fills</button>
    </span>
  </div>
  <div class="rp-logs" id="rpnlLogs" hidden>
    <div class="rp-logs-h">
      <select id="rpnlKindScope" title="Which rows" onchange="rpnlKindReload()">
        <option value="contract" selected>This contract</option>
        <option value="all">All</option>
      </select>
      <b id="rpnlLogsTitle">Logs</b>
      <span id="rpnlLogsStatus" class="ctrl-meta"></span>
      <input type="search" id="rpnlKindSearch" class="rp-kind-search" placeholder="search fate, pause…" onkeydown="if(event.key==='Enter') rpnlKindReload()" />
      <button class="btn" type="button" onclick="rpnlKindReload()">Refresh</button>
      <label class="rp-check" id="rpnlKindLiveWrap"><input type="checkbox" id="rpnlLogsLive" checked /> Live</label>
      <button class="btn" type="button" onclick="exportRpnlOpenKind()" title="CSV of the current From/To + filters">Export CSV</button>
      <button class="btn" type="button" onclick="closeRpnlKind()">Close</button>
    </div>
    <div class="logs-box rp-logs-box" id="rpnlLogsBox"></div>
  </div>
</div>
